<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="qr-code-component-main/images/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    .visuallyhidden {
      border: 0;
      clip: rect(0 0 0 0);
      height: 1px;
      margin: -1px;
      overflow: hidden;
      padding: 0;
      position: absolute;
      width: 1px;
    }

    :root {
      /* color-scheme */
      --white: hsl(0, 0%, 100%);
      --Slate300: hsl(212, 45%, 89%);
      --Slate500: hsl(216, 15%, 48%);
      --Slate900: hsl(218, 44%, 22%);
      --blue: hsl(216, 97%, 59%);
    }

    *::before, *, *::after {
      box-sizing: border-box;
    }

    body {
      background-color: var(--Slate300);
      height: 100dvh;
      position: relative;
    }
    
    p {
      font-size: 15px;
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      color: var(--Slate500);
      text-align: center; 
    }

    .qrComponent {
      background-color: var(--white);
      border-radius: 20px;
      height: 31.25rem;
      width: 20rem;
      padding: 16px;
      display: flex;
      flex-direction: column;

      position: absolute;
      inset: 50% 0 0 50%;
      transform: translate(-50%, -50%);

    }

    .qrComponent h2 {
      font-size: 1.375rem;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
    }

    .qrComponent__content {
      padding: 0 1rem;
    }

    .qrComponent__image {
      display: block;
      height: 100%;
      width: 100%;
      
    }

    .qrComponent__link {
      display: block;
      height: 288px;
      width: 288px;
      background-color: var(--blue);
      border-radius: 14px;
      text-align: center;
      font-size: 2rem;
      overflow: hidden;
      text-decoration: none;
      color: var(--white);
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <header>
    <div class="attribution visuallyhidden">
      <h1> QR component </h1>
    </div> 
  </header>

  <main>
    <section class="qrComponent">
      <a href="https://www.frontendmentor.io/" class="qrComponent__link"> 
        <img src="./qr-code-component-main/images/image-qr-code.png" alt="frontendmentor.io" class="qrComponent__image" />
      </a>

      <div class="qrComponent__content">
        <h2> Improve your front-end skills by building projects </h2>

        <p> Scan the QR code to visit Frontend Mentor and take your coding skills to the next level </p>
      </div>
    </section>
  </main>
  
  <footer>
    <div class="attribution visuallyhidden">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"> Frontend Mentor </a>. 
      Coded by <a href="https://www.frontendmentor.io/profile/Nitr0Skay"> Nitr0Skay </a>.
    </div>
  </footer>

</body>
</html>
